
name: CD - deploy EC2

on:
  workflow_run:
    workflows: ["CI - tests and image"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        vars.DEPLOY_ENABLED == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}

    runs-on: [self-hosted, linux, x64, deploy-ec2]
    timeout-minutes: 15
    environment: production

    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

    outputs:
      current: ${{ steps.freshness.outputs.current }}

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Skip if a newer commit is already on main
        id: freshness
        shell: bash
        run: |
          MAIN_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$MAIN_SHA"

          if [[ "$MAIN_SHA" == "$DEPLOY_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping outdated deployment"
          fi

      - name: Deploy immutable image on EC2
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${DEPLOY_SHA}"

          bash scripts/deploy.sh "$IMAGE"

  verify-https:
    needs: deploy
    if: needs.deploy.outputs.current == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify public HTTPS health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$APP_URL" =~ ^https://[a-zA-Z0-9.-]+/?$ ]] || {
            echo "APP_URL must be a valid HTTPS URL" >&2
            exit 1
          }

          curl --fail --silent --show-error \
            --connect-timeout 5 \
            --max-time 10 \
            --retry 10 \
            --retry-delay 3 \
            --retry-all-errors \
            "${APP_URL%/}/health"

          echo "Public HTTPS health check passed"
