
name: CD - deploy EC2

on:
  workflow_run:
    workflows: ["CI - tests and image"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        vars.DEPLOY_ENABLED == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}

    runs-on: [self-hosted, linux, x64, deploy-ec2]
    timeout-minutes: 15
    environment: production

    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}

    outputs:
      current: ${{ steps.freshness.outputs.current }}

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Check deployment freshness
        id: freshness
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking current main commit..."

          MAIN_SHA="$(git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)" ls-remote origin refs/heads/main | cut -f1)"

          if [[ -z "$MAIN_SHA" ]]; then
            echo "::error::Could not retrieve main SHA"
            exit 1
          fi

          echo "=================================="
          echo "DEPLOY_SHA: $DEPLOY_SHA"
          echo "MAIN_SHA:   $MAIN_SHA"
          echo "=================================="

          if [[ "$MAIN_SHA" == "$DEPLOY_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Commit is current. Deployment authorized."
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping outdated deployment"
            echo "A newer commit exists on main. Deployment skipped."
          fi

      - name: Deploy immutable image on EC2
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail

          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Invalid deployment SHA"
            exit 1
          }

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${DEPLOY_SHA}"

          echo "Deploying image: $IMAGE"

          bash scripts/deploy.sh "$IMAGE"

          echo "Deployment command completed successfully."

  verify-https:
    needs: deploy
    if: >-
      ${{
        always() &&
        needs.deploy.result == 'success' &&
        needs.deploy.outputs.current == 'true'
      }}

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify public HTTPS health endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
        shell: bash
        run: |
          set -euo pipefail

          [[ "$APP_URL" =~ ^https://[a-zA-Z0-9.-]+/?$ ]] || {
            echo "::error::APP_URL must be a valid HTTPS URL"
            exit 1
          }

          echo "Checking public HTTPS health endpoint..."

          curl --fail --silent --show-error \
            --connect-timeout 5 \
            --max-time 10 \
            --retry 10 \
            --retry-delay 3 \
            --retry-all-errors \
            "${APP_URL%/}/health"

          echo "Public HTTPS health check passed."
